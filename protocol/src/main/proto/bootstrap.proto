syntax = "proto3";

option java_multiple_files = true;
option java_package = "cs324.assignment2.grpc";
option java_outer_classname = "BootstrapProto";

package bootstrap;

message WorkerInfo {
  int32 id   = 1;
  string host = 2;
  int32 port  = 3;
}

service BootstrapService {
  rpc RegisterWorker (RegisterWorkerRequest) returns (RegisterWorkerResponse);
  rpc DeregisterWorker (DeregisterWorkerRequest) returns (DeregisterWorkerResponse);
  rpc GetActiveWorkers (GetActiveWorkersRequest) returns (GetActiveWorkersResponse);
  rpc Heartbeat (HeartbeatRequest) returns (HeartbeatResponse);
}

message RegisterWorkerRequest {
  string host = 1;
  int32  port = 2;
}

message RegisterWorkerResponse {
  int32 worker_id = 1;
}

message DeregisterWorkerRequest {
  int32 worker_id = 1;
}

message DeregisterWorkerResponse {}

message GetActiveWorkersRequest {}

message GetActiveWorkersResponse {
  repeated WorkerInfo workers = 1;
}

message HeartbeatRequest {
  int32 worker_id = 1;
}

message HeartbeatResponse {
  bool acknowledged = 1;
}
