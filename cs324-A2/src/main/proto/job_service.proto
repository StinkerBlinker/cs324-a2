syntax = "proto3";

option java_multiple_files = true;
option java_package = "cs324.assignment2.job.grpc";
option java_outer_classname = "JobServiceProto";

package job;

service JobService {
  rpc SubmitJob (SubmitJobRequest) returns (SubmitJobResponse);
  rpc StreamJobProgress (StreamJobProgressRequest) returns (stream JobProgressUpdate);
}

message SubmitJobRequest {
  string job_type = 1;
  map<string, string> parameters = 2;
  bytes payload = 3;
}

message SubmitJobResponse {
  string job_id = 1;
  JobStatus status = 2;
  string message = 3;
}

message StreamJobProgressRequest {
  string job_id = 1;
}

message JobProgressUpdate {
  string job_id = 1;
  JobStatus status = 2;
  double completion_percentage = 3;
  int32 active_worker_count = 4;
  repeated WorkerStatusMetric workers = 5;
  repeated SubTaskStatus sub_tasks = 6;
  string message = 7;
  int64 updated_at_unix_ms = 8;
}

message WorkerStatusMetric {
  int32 worker_id = 1;
  WorkerStatus status = 2;
  double completion_percentage = 3;
  int32 active_sub_task_count = 4;
  int32 completed_sub_task_count = 5;
  string status_message = 6;
}

message SubTaskStatus {
  string sub_task_id = 1;
  SubTaskState state = 2;
  double completion_percentage = 3;
  int32 worker_id = 4;
  string message = 5;
}

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_QUEUED = 1;
  JOB_STATUS_RUNNING = 2;
  JOB_STATUS_COMPLETED = 3;
  JOB_STATUS_FAILED = 4;
  JOB_STATUS_CANCELLED = 5;
}

enum WorkerStatus {
  WORKER_STATUS_UNSPECIFIED = 0;
  WORKER_STATUS_IDLE = 1;
  WORKER_STATUS_ACTIVE = 2;
  WORKER_STATUS_UNAVAILABLE = 3;
  WORKER_STATUS_FAILED = 4;
}

enum SubTaskState {
  SUB_TASK_STATE_UNSPECIFIED = 0;
  SUB_TASK_STATE_PENDING = 1;
  SUB_TASK_STATE_RUNNING = 2;
  SUB_TASK_STATE_COMPLETED = 3;
  SUB_TASK_STATE_FAILED = 4;
}
