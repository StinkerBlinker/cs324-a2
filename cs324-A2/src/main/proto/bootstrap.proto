syntax = "proto3";

option java_multiple_files = true;
option java_package = "cs324.assignment2.grpc";
option java_outer_classname = "BootstrapProto";

package bootstrap;

message WorkerInfo {
  int32 id   = 1;
  string host = 2;
  int32 port  = 3;
}

service BootstrapService {
  rpc RegisterWorker (RegisterWorkerRequest) returns (RegisterWorkerResponse);
  rpc DeregisterWorker (DeregisterWorkerRequest) returns (DeregisterWorkerResponse);
  rpc GetActiveWorkers (GetActiveWorkersRequest) returns (GetActiveWorkersResponse);
  rpc Heartbeat (HeartbeatRequest) returns (HeartbeatResponse);
  // Metadata only: workers still perform flooding, candidacy and winner selection.
  rpc GetClusterView (GetClusterViewRequest) returns (ClusterView);
  rpc BeginElection (BeginElectionRequest) returns (ClusterView);
  rpc PublishCoordinator (PublishCoordinatorRequest) returns (ClusterView);
  rpc MarkCoordinatorReady (MarkCoordinatorReadyRequest) returns (ClusterView);
}

message RegisterWorkerRequest {
  string host = 1;
  int32  port = 2;
}

message RegisterWorkerResponse {
  int32 worker_id = 1;
}

message DeregisterWorkerRequest {
  int32 worker_id = 1;
}

message DeregisterWorkerResponse {}

message GetActiveWorkersRequest {}

message GetActiveWorkersResponse {
  repeated WorkerInfo workers = 1;
}

message HeartbeatRequest {
  int32 worker_id = 1;
}

message HeartbeatResponse {
  bool acknowledged = 1;
}

message GetClusterViewRequest {}
message ClusterView {
  int64 epoch = 1;
  WorkerInfo initiator = 2;
  WorkerInfo coordinator = 3;
  bool ready = 4;
  repeated WorkerInfo voters = 5;
  repeated WorkerInfo previous_voters = 6;
  int64 membership_version = 7;
  bool election_in_progress = 8;
}
message BeginElectionRequest {
  int32 worker_id = 1;
  int64 observed_epoch = 2;
  bool force = 3;
}
message PublishCoordinatorRequest {
  int64 epoch = 1;
  int32 initiator_id = 2;
  int32 coordinator_id = 3;
}
message MarkCoordinatorReadyRequest {
  int64 epoch = 1;
  int32 coordinator_id = 2;
}
